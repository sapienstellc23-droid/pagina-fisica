<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enciclopedia en Videos de Demostración de Física</title>
    <style>
        :root {
            /* Tema claro tipo laboratorio */
            --bg-main: #f5f7fa;
            --bg-paper: #ffffff;
            --panel-bg: #ffffff;
            --panel-alt: #eef2f7;
            --accent: #1e40af;
            --accent-light: #3b82f6;
            --accent-hover: #1d4ed8;
            --highlight: #f59e0b;
            --highlight-dark: #d97706;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-soft: #e2e8f0;
            --border-strong: #cbd5e1;
            --success: #059669;
            --success-bg: #ecfdf5;
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
            --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
            --shadow-lg: 0 10px 30px rgba(15, 23, 42, 0.1);
        }

        * { box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-main);
            background-image:
                radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(245, 158, 11, 0.04) 0%, transparent 50%);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        /* ===== ENCABEZADO ===== */
        header {
            background: linear-gradient(135deg, #ffffff 0%, #eef2f7 100%);
            border-bottom: 4px solid var(--accent);
            padding: 1.8rem 2rem 1.5rem 2rem;
            text-align: center;
            box-shadow: var(--shadow-md);
            position: relative;
        }

        header::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--accent) 0%, var(--highlight) 50%, var(--accent) 100%);
        }

        .header-logos {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1000px;
            margin: 0 auto 1rem auto;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-logos .univ,
        .header-logos .fac {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            color: var(--accent);
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header-logos svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        header h1 {
            margin: 0.5rem 0 0 0;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 1.9rem;
            letter-spacing: 0.5px;
            color: var(--text-main);
            font-weight: 700;
        }

        header h2 {
            margin: 0.4rem 0 0 0;
            font-size: 1rem;
            color: var(--text-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .container {
            max-width: 950px;
            margin: 2.5rem auto;
            padding: 0 1.5rem;
        }

        /* ===== VISTAS (SPA) ===== */
        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== CAJA SELECTORA DE CAPÍTULOS ===== */
        .selector-box-container {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-soft);
            border-radius: 14px;
            box-shadow: var(--shadow-md);
            overflow: hidden;
            margin-top: 1rem;
        }

        .selector-box-header {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            padding: 1.1rem 1.5rem;
            text-align: center;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        .selector-box-header svg {
            width: 22px;
            height: 22px;
        }

        .chapters-scroll-list {
            max-height: 480px;
            overflow-y: auto;
            padding: 0.75rem;
            background: var(--panel-bg);
        }

        .chapter-item {
            padding: 0.95rem 1.2rem;
            margin: 0.4rem 0;
            background-color: var(--panel-bg);
            color: var(--text-main);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease;
            border: 1.5px solid var(--border-soft);
            display: flex;
            align-items: center;
            gap: 0.85rem;
        }

        .chapter-item:hover {
            background-color: var(--panel-alt);
            border-color: var(--accent);
            transform: translateX(6px);
            box-shadow: var(--shadow-sm);
        }

        .chapter-item .chapter-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: #fff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s ease;
        }

        .chapter-item:hover .chapter-icon {
            background: linear-gradient(135deg, var(--highlight), var(--highlight-dark));
        }

        .chapter-item .chapter-icon svg {
            width: 20px;
            height: 20px;
        }

        .chapter-item .chapter-text {
            flex: 1;
        }

        .chapter-item .chapter-arrow {
            color: var(--text-muted);
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .chapter-item:hover .chapter-arrow {
            color: var(--accent);
            transform: translateX(4px);
        }

        /* Scrollbar personalizado */
        .chapters-scroll-list::-webkit-scrollbar { width: 10px; }
        .chapters-scroll-list::-webkit-scrollbar-track { background: var(--panel-alt); }
        .chapters-scroll-list::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 5px;
            border: 2px solid var(--panel-alt);
        }
        .chapters-scroll-list::-webkit-scrollbar-thumb:hover { background: var(--accent-light); }

        /* ===== VISTA DE DETALLE ===== */
        .btn-back {
            background-color: var(--panel-bg);
            color: var(--accent);
            border: 1.5px solid var(--border-soft);
            padding: 0.65rem 1.3rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            margin-bottom: 1.5rem;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: var(--shadow-sm);
        }

        .btn-back:hover {
            background-color: var(--panel-alt);
            border-color: var(--accent);
            transform: translateX(-3px);
        }

        .btn-back svg { width: 16px; height: 16px; }

        .chapter-title-banner {
            background: linear-gradient(135deg, #ffffff, var(--panel-alt));
            border-left: 6px solid var(--accent);
            padding: 1.5rem 1.8rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-sm);
        }

        .chapter-title-banner h2 {
            margin: 0 0 0.5rem 0;
            color: var(--accent);
            font-family: Georgia, serif;
            font-size: 1.55rem;
            font-weight: 700;
        }

        .chapter-title-banner p {
            margin: 0;
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* ===== TARJETAS DE VIDEO ===== */
        .video-card {
            background-color: var(--panel-bg);
            border-radius: 14px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-soft);
            transition: box-shadow 0.2s ease;
        }

        .video-card:hover {
            box-shadow: var(--shadow-lg);
        }

        .video-meta h4 {
            margin: 0.3rem 0 0.6rem 0;
            color: var(--text-main);
            font-size: 1.2rem;
            font-weight: 700;
            font-family: Georgia, serif;
        }

        .video-meta p {
            margin: 0.35rem 0;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .video-meta p strong {
            color: var(--text-main);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background-color: #fef3c7;
            color: var(--highlight-dark);
            padding: 0.3rem 0.75rem;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid #fde68a;
        }

        .badge svg { width: 14px; height: 14px; }

        .video-responsive {
            position: relative;
            width: 100%;
            background: #000;
            margin: 1rem 0;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: var(--shadow-sm);
        }

        .video-responsive video {
            width: 100%;
            max-height: 450px;
            outline: none;
            display: block;
        }

        /* ===== CUESTIONARIO ===== */
        .quiz-box {
            background-color: #f8fafc;
            border-radius: 10px;
            padding: 1.3rem 1.4rem;
            margin-top: 1.2rem;
            border: 1.5px solid var(--border-soft);
            border-left: 4px solid var(--highlight);
        }

        .quiz-box h5 {
            margin-top: 0;
            color: var(--highlight-dark);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .quiz-box h5 svg { width: 18px; height: 18px; }

        .question-item {
            margin-bottom: 1rem;
            padding-bottom: 0.9rem;
            border-bottom: 1px dashed var(--border-strong);
        }

        .question-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .question-item p {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 0.6rem;
            color: var(--text-main);
        }

        .options-list label {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.45rem;
            cursor: pointer;
            font-size: 0.92rem;
            color: var(--text-muted);
            padding: 0.55rem 0.8rem;
            border-radius: 8px;
            transition: all 0.15s;
            border: 1.5px solid transparent;
        }

        .options-list label:hover {
            background-color: var(--panel-alt);
            color: var(--text-main);
            border-color: var(--border-soft);
        }

        .options-list input[type="radio"] {
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .options-list label:has(input:checked) {
            background-color: #dbeafe;
            color: var(--accent);
            border-color: var(--accent-light);
            font-weight: 600;
        }

        /* ===== BOTÓN EVALUAR ===== */
        .btn-submit {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: #ffffff;
            border: none;
            padding: 1rem 1.5rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            width: 100%;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-top: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            box-shadow: 0 4px 14px rgba(30, 64, 175, 0.25);
        }

        .btn-submit svg { width: 20px; height: 20px; }

        .btn-submit:hover {
            background: linear-gradient(135deg, var(--accent-hover), var(--accent));
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(30, 64, 175, 0.35);
        }

        /* ===== RESULTADO ===== */
        .score-display {
            background-color: var(--success-bg);
            border: 2px solid var(--success);
            color: #065f46;
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
            margin-top: 1.5rem;
            font-size: 1.15rem;
            font-weight: 700;
            display: none;
            box-shadow: var(--shadow-sm);
        }

        .score-display svg {
            width: 40px;
            height: 40px;
            color: var(--success);
            margin-bottom: 0.5rem;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        /* Responsive */
        @media (max-width: 600px) {
            header h1 { font-size: 1.4rem; }
            header h2 { font-size: 0.85rem; letter-spacing: 2px; }
            .header-logos { justify-content: center; text-align: center; }
            .chapter-item { font-size: 0.9rem; padding: 0.8rem 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-logos">
            <span class="univ">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                    <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                </svg>
                Universidad Nacional Mayor de San Marcos
            </span>
            <span class="fac">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M12 1v6m0 10v6M4.22 4.22l4.24 4.24m7.08 7.08l4.24 4.24M1 12h6m10 0h6M4.22 19.78l4.24-4.24m7.08-7.08l4.24-4.24"/>
                </svg>
                Facultad de Ciencias Físicas
            </span>
        </div>
        <h1>Enciclopedia en Videos de Demostración de Física</h1>
        <h2>Portal Académico Interactivo</h2>
    </header>

    <div class="container">
        <!-- VISTA DE PORTADA -->
        <div id="home-view" class="view active">
            <div class="selector-box-container">
                <div class="selector-box-header">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="23 7 16 12 23 17 23 7"/>
                        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
                    </svg>
                    Videos — Seleccione un Capítulo
                </div>
                <div class="chapters-scroll-list" id="chapters-list-container"></div>
            </div>
        </div>

        <!-- VISTA DE DETALLE -->
        <div id="chapter-view" class="view">
            <button class="btn-back" onclick="goToHome()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"/>
                    <polyline points="12 19 5 12 12 5"/>
                </svg>
                Volver al Menú Principal
            </button>
            <div id="chapter-header-banner" class="chapter-title-banner"></div>
            <div id="videos-container"></div>
            <button class="btn-submit" id="btn-evaluar" onclick="submitChapterQuiz()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
                Enviar y Evaluar Respuestas
            </button>
            <div id="score-box" class="score-display"></div>
        </div>
    </div>

    <script>
        const physicsChapters = {
            1: {
                title: "Capítulo 1: Unidades y vectores",
                description: "Demostraciones prácticas sobre sistemas de unidades, vectores en 2D y 3D, y operaciones vectoriales.",
                videos: [
                    { id: "01-01", file: "videos/01-01.mp4", title: "01-01 Unidades básicas", description: "Demostración de las unidades fundamentales del Sistema Internacional.", objectives: "Comprender la medición física y los patrones fundamentales.", questions: [{ text: "¿Cuál es la unidad base del Sistema Internacional para medir la masa?", options: ["Kilogramo (kg)", "Gramo (g)", "Libra (lb)", "Newton (N)"], correct: 0 }] },
                    { id: "01-02", file: "videos/01-02.mp4", title: "01-02 Suma de vectores (paralelogramo)", description: "Método geométrico del paralelogramo para la adición de vectores concurrentes.", objectives: "Visualizar la resultante vectorial mediante construcción geométrica.", questions: [{ text: "En el método del paralelogramo, ¿dónde se origina el vector resultante?", options: ["En el extremo de uno de los vectores", "En el punto de aplicación común de ambos vectores", "En el punto medio", "Fuera del plano"], correct: 1 }] },
                    { id: "01-03", file: "videos/01-03.mp4", title: "01-03 Suma de vectores (puntas con colas)", description: "Método del polígono o punta-cola para sumar múltiples vectores consecutivos.", objectives: "Aplicar la regla geométrica sucesiva para sumar sistemas de vectores.", questions: [{ text: "¿Cómo se conectan los vectores consecutivos en este método?", options: ["Cola con cola", "Punta con punta", "La punta del primero con la cola del segundo", "Cruzados perpendicularmente"], correct: 2 }] },
                    { id: "01-04", file: "videos/01-04.mp4", title: "01-04 Componentes de un vector", description: "Descomposición ortogonal de un vector bidimensional en sus ejes X e Y.", objectives: "Hallar las proyecciones escalares y vectoriales empleando trigonometría.", questions: [{ text: "Si un vector forma un ángulo θ con el eje horizontal, ¿con qué función trigonométrica se calcula su componente en X?", options: ["Seno", "Coseno", "Tangente", "Secante"], correct: 1 }] },
                    { id: "01-05", file: "videos/01-05.mp4", title: "01-05 Producto punto de vectores", description: "Análisis físico y geométrico del producto escalar.", objectives: "Calcular el trabajo mecánico y la proyección escalar entre dos vectores.", questions: [{ text: "¿Qué tipo de cantidad matemática resulta al efectuar el producto punto de dos vectores?", options: ["Un vector", "Un escalar", "Un tensor", "Una matriz"], correct: 1 }] },
                    { id: "01-06", file: "videos/01-06.mp4", title: "01-06 Producto cruz de vectores", description: "Demostración del producto vectorial y la regla de la mano derecha.", objectives: "Determinar vectores perpendiculares y momentos de torsión.", questions: [{ text: "¿Cuál es el valor del producto cruz entre dos vectores que tienen la misma dirección (paralelos)?", options: ["Máximo", "Uno", "Cero", "Infinito"], correct: 2 }] },
                    { id: "01-07", file: "videos/01-07.mp4", title: "01-07 Componentes de vectores en 3 dimensiones", description: "Extensión del sistema coordenado tridimensional cartesiano (X, Y, Z).", objectives: "Ubicar y descomponer vectores espaciales mediante cosenos directores.", questions: [{ text: "En un espacio tridimensional cartesiano, ¿cómo son entre sí los ejes X, Y y Z?", options: ["Paralelos", "Mutuamente perpendiculares", "Forman 45 grados", "Colineales"], correct: 1 }] }
                ]
            },
            2: {
                title: "Capítulo 2: Cinemática lineal",
                description: "Demostraciones de movimiento en una dimensión, velocidad constante y aceleración.",
                videos: [
                    { id: "02-01", file: "videos/02-01.mp4", title: "02-01 Velocidad constante", description: "Estudio experimental de cuerpos en movimiento rectilíneo uniforme.", objectives: "Analizar la constancia de la velocidad en intervalos iguales de tiempo.", questions: [{ text: "¿Cómo es la aceleración de un móvil que viaja a velocidad constante?", options: ["Constante y positiva", "Cero", "Variable", "Máxima"], correct: 1 }] },
                    { id: "02-02", file: "videos/02-02.mp4", title: "02-02 Buldócer sobre una hoja en movimiento", description: "Análisis analítico de sistemas de referencia en movimiento.", objectives: "Comprender la relatividad del movimiento y velocidades relativas.", questions: [{ text: "La velocidad de un objeto medida por un observador en movimiento depende de:", options: ["Solo la masa del objeto", "El marco o sistema de referencia elegido", "La temperatura ambiente", "La presión atmosférica"], correct: 1 }] },
                    { id: "02-03", file: "videos/02-03.mp4", title: "02-03 Plano inclinado con pelota que rueda", description: "Cinemática de cuerpos acelerados bajo la acción de la gravedad en planos inclinados.", objectives: "Determinar la aceleración constante en pendientes reducidas.", questions: [{ text: "Al disminuir el ángulo de inclinación de un plano respecto a la horizontal, ¿qué ocurre con la aceleración de la pelota?", options: ["Aumenta", "Disminuye", "Permanece invariable", "Se hace cero instantáneamente"], correct: 1 }] },
                    { id: "02-04", file: "videos/02-04.mp4", title: "02-04 Aceleración constante", description: "Demostración de cambios uniformes en la velocidad a lo largo del tiempo.", objectives: "Calcular la aceleración media e instantánea experimentalmente.", questions: [{ text: "En un gráfico de velocidad en función del tiempo, ¿qué representa la pendiente de la recta?", options: ["El desplazamiento", "La aceleración", "La velocidad media", "La distancia recorrida"], correct: 1 }] },
                    { id: "02-05", file: "videos/02-05.mp4", title: "02-05 Caída de una cuerda con tuercas", description: "Distribución espacial de intervalos temporales en la caída libre.", objectives: "Evidenciar la no linealidad del espacio recorrido respecto al tiempo en la caída libre.", questions: [{ text: "En la caída libre ideal, las distancias recorridas en intervalos de tiempo iguales sucesivos guardan proporción con:", options: ["Los números pares", "Los números impares (1, 3, 5...)", "Una progresión aritmética lineal", "Son idénticas"], correct: 1 }] },
                    { id: "02-06", file: "videos/02-06.mp4", title: "02-06 Tiempo de reacción a la caída de un metro", description: "Experimento clásico para medir el tiempo de respuesta neurobiológica.", objectives: "Relacionar la distancia de caída libre con el tiempo de reacción humano.", questions: [{ text: "Si una regla cae una distancia mayor antes de ser atrapada, el tiempo de reacción del sujeto es:", options: ["Menor", "Mayor", "Exactamente igual", "Independiente"], correct: 1 }] },
                    { id: "02-07", file: "videos/02-07.mp4", title: "02-07 Guinea y pluma", description: "Caída libre de objetos de diferente masa en el vacío y con resistencia del aire.", objectives: "Demostrar que en el vacío todos los cuerpos caen con la misma aceleración.", questions: [{ text: "¿Por qué una pluma cae más lento que una moneda en presencia de aire?", options: ["Por la gravedad local", "Por la fuerza de resistencia o fricción del aire", "Porque no tiene masa", "Por efecto magnético"], correct: 1 }] }
                ]
            },
            3: {
                title: "Capítulo 3: Dinámica lineal",

                    { id: "09-07", file: "videos/09-07.mp4", title: "09-07 Disco cargado", description: "Desplazamiento intencional del centro de masa en un cilindro.", objectives: "Estudiar el comportamiento dinámico de masas excéntricas.", questions: [{ text: "Al colocar un peso interno excéntrico, el disco tiende a detenerse siempre con la masa:", options: ["Arriba", "En la parte más baja (equilibrio estable)", "A la derecha", "Girando sin parar"], correct: 1 }] },
                    { id: "09-08", file: "videos/09-08.mp4", title: "09-08 Cilindros que caen", description: "Dinámica de rotación y traslación combinada.", objectives: "Comparar momentos de inercia en caída.", questions: [{ text: "El movimiento de los cilindros depende de cómo está distribuida su:", options: ["Masa respecto al eje", "Temperatura", "Color", "Longitud"], correct: 0 }] },
                    { id: "09-09", file: "videos/09-09.mp4", title: "09-09 Centro de masa en una mesa de aire", description: "Trayectoria del centro de masa en sistemas libres de fuerzas externas.", objectives: "Verificar que el centro de masa sigue una trayectoria rectilínea o reposo.", questions: [{ text: "Si dos objetos ligados explotan o chocan sobre una mesa de aire sin fuerzas externas, su centro de masa:", options: ["Se desvía bruscamente", "Mantiene su estado de movimiento inercial", "Se detiene al instante", "Gira en círculos"], correct: 1 }] }
                ]
            }
        };

        // Íconos SVG para cada capítulo (relacionados con su temática)
        const chapterIcons = {
            1: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 16l4-8 4 5 5-9"/></svg>', // Vectores/gráfica
            2: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>', // Cinemática/reloj
            3: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>', // Fuerza/llave
            4: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22s2-8 8-11 8-8 8-8"/><circle cx="6" cy="20" r="2"/></svg>', // Parábola/trayectoria
            5: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>', // Inercia/átomo
            6: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>', // Acción-reacción/flechas
            7: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="14" width="18" height="6" rx="1"/><path d="M5 14V8a2 2 0 0 1 2-2h3"/><path d="M14 14V6a2 2 0 0 1 2-2h3"/></svg>', // Fricción/superficie
            8: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>', // Rayo/energía
            9: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3" fill="currentColor"/><line x1="12" y1="2" x2="12" y2="9"/><line x1="12" y1="15" x2="12" y2="22"/></svg>' // Centro de masa/balanza
        };

        let activeChapterId = null;

        function randomizeOptions(question) {
            let indexedOpts = question.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
            for (let i = indexedOpts.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [indexedOpts[i], indexedOpts[j]] = [indexedOpts[j], indexedOpts[i]];
            }
            const newCorrectIndex = indexedOpts.findIndex(item => item.originalIndex === question.correct);
            return { text: question.text, options: indexedOpts.map(item => item.text), correct: newCorrectIndex };
        }

        function goToHome() {
            const listContainer = document.getElementById('chapters-list-container');
            listContainer.innerHTML = '';

            for (let id in physicsChapters) {
                const ch = physicsChapters[id];
                const itemDiv = document.createElement('div');
                itemDiv.className = 'chapter-item';
                itemDiv.innerHTML = `
                    <div class="chapter-icon">${chapterIcons[id] || chapterIcons[1]}</div>
                    <div class="chapter-text">${ch.title}</div>
                    <div class="chapter-arrow">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"/>
                        </svg>
                    </div>
                `;
                itemDiv.onclick = () => openChapter(id);
                listContainer.appendChild(itemDiv);
            }

            document.getElementById('chapter-view').classList.remove('active');
            document.getElementById('home-view').classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openChapter(id) {
            activeChapterId = id;
            const ch = physicsChapters[id];

            document.getElementById('home-view').classList.remove('active');
            document.getElementById('chapter-view').classList.add('active');

            document.getElementById('chapter-header-banner').innerHTML = `
                <h2>${ch.title}</h2>
                <p>${ch.description}</p>
            `;

            const videosContainer = document.getElementById('videos-container');
            videosContainer.innerHTML = '';

            ch.videos.forEach((vid, vIdx) => {
                const randomizedQuestions = vid.questions.map(q => randomizeOptions(q));
                vid._activeRandomizedQuestions = randomizedQuestions;

                let quizHtml = '';
                randomizedQuestions.forEach((q, qIdx) => {
                    let optionsHtml = '';
                    q.options.forEach((opt, oIdx) => {
                        optionsHtml += `
                            <label>
                                <input type="radio" name="q_${vid.id}_${qIdx}" value="${oIdx}">
                                ${opt}
                            </label>
                        `;
                    });
                    quizHtml += `
                        <div class="question-item">
                            <p>Pregunta ${qIdx + 1}: ${q.text}</p>
                            <div class="options-list">${optionsHtml}</div>
                        </div>
                    `;
                });

                const videoCard = document.createElement('div');
                videoCard.className = 'video-card';
                videoCard.innerHTML = `
                    <div class="video-meta">
                        <span class="badge">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="23 7 16 12 23 17 23 7"/>
                                <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
                            </svg>
                            Demostración ${vIdx + 1}
                        </span>
                        <h4>${vid.title}</h4>
                        <p><strong>Descripción:</strong> ${vid.description}</p>
                        <p><strong>Objetivos:</strong> ${vid.objectives}</p>
                    </div>
                    <div class="video-responsive">
                        <video controls preload="metadata">
                            <source src="${vid.file}" type="video/mp4">
                            Tu navegador no soporta la reproducción de videos locales.
                        </video>
                    </div>
                    <div class="quiz-box">
                        <h5>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 11l3 3L22 4"/>
                                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                            </svg>
                            Cuestionario de Evaluación
                        </h5>
                        ${quizHtml}
                    </div>
                `;
                videosContainer.appendChild(videoCard);
            });

            const scoreBox = document.getElementById('score-box');
            scoreBox.style.display = 'none';
            scoreBox.innerHTML = '';
            document.getElementById('btn-evaluar').style.display = 'flex';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function submitChapterQuiz() {
            if (!activeChapterId) return;
            const ch = physicsChapters[activeChapterId];

            let total = 0;
            let correctCount = 0;
            let allAnswered = true;

            ch.videos.forEach(vid => {
                vid._activeRandomizedQuestions.forEach((q, qIdx) => {
                    total++;
                    const radios = document.querySelectorAll(`input[name="q_${vid.id}_${qIdx}"]`);
                    let answered = false;
                    let selectedVal = -1;

                    radios.forEach(r => {
                        if (r.checked) { answered = true; selectedVal = parseInt(r.value); }
                    });

                    if (!answered) allAnswered = false;
                    else if (selectedVal === q.correct) correctCount++;
                });
            });

            if (!allAnswered) {
                alert("Por favor, responda todas las preguntas antes de enviar su evaluación.");
                return;
            }

            let grade = Math.round((correctCount / total) * 20 * 10) / 10;

            const scoreBox = document.getElementById('score-box');
            scoreBox.style.display = 'block';
            scoreBox.innerHTML = `
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                    <polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
                ¡Evaluación completada con éxito!<br>
                Respuestas Correctas: ${correctCount} de ${total}<br>
                Nota Obtenida: ${grade} / 20
            `;

            document.querySelectorAll('#videos-container input[type="radio"]').forEach(r => r.disabled = true);
            document.getElementById('btn-evaluar').style.display = 'none';
            scoreBox.scrollIntoView({ behavior: 'smooth' });
        }

        window.onload = function() { goToHome(); };
    </script>
</body>
</html>
